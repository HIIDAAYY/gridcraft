[package]
name = "gridcraft-android"
description = "GridCraft on Android phones and tablets (eframe NativeActivity runner, wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace's lints, except one: the Android entry point (`android_main`, exported by name)
# and the JNI bridge need `unsafe`, which the workspace forbids. It is denied here and allowed
# only in `src/bridge.rs` and on `android_main`, each with a SAFETY note.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[lib]
name = "gridcraft_android"
# `cdylib` is what Android's NativeActivity loads (`libgridcraft_android.so`); `rlib` keeps
# `cargo test` able to run the platform-independent gesture, inbox and file tests on the desktop.
crate-type = ["cdylib", "rlib"]

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
# The `AndroidApp` handle eframe takes (eframe doesn't re-export winit); the same winit eframe
# uses (the workspace's patched fork).
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
# Logcat (`adb logcat -s GridCraft`).
android_logger = { version = "0.15", default-features = false }
# The Java side of the shell (file pickers, clipboard, printing, typed text): the same JNI
# version android-activity already brings in.
jni = "0.22.4"
